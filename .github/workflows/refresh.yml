name: Weekly refresh

on:
  schedule:
    # Sundays at 07:00 UTC = midnight Pacific. Cron here is always UTC.
    - cron: "0 7 * * 0"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write           # needed to commit the refreshed data file

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Scrape
        id: scrape
        continue-on-error: true      # partial failure still publishes what worked
        env:
          IDEALIST_API_KEY: ${{ secrets.IDEALIST_API_KEY }}
        run: python run.py

      - name: Commit refreshed listings
        run: |
          git config user.name  "volunteer-bot"
          git config user.email "actions@github.com"
          git add data/opportunities.json
          if git diff --staged --quiet; then
            echo "No listing changes this week."
          else
            git commit -m "Refresh listings $(date +%Y-%m-%d)"
            git push
          fi

      # Surfaces broken scrapers instead of letting the board quietly rot.
      - name: Flag scraper failures
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::warning::One or more scrapers failed. Check the Scrape step log."
